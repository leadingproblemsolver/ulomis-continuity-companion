[build]
  command = "bun install && bun run build:static"
  publish = "dist/client"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints every filename in dist/assets, so these are safe to
    # cache forever — a content change always ships under a new filename.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
