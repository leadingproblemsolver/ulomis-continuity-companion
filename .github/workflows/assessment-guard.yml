name: Assessment Guard

on:
  push:
    paths:
      - "apps/assessment-guard/**"
      - ".github/workflows/assessment-guard.yml"
  pull_request:
    paths:
      - "apps/assessment-guard/**"
      - ".github/workflows/assessment-guard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/assessment-guard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Unit tests (Asia/Qatar, America/New_York, UTC)
        run: npm test
      - name: Syntax and bundle check
        run: npm run check
      - name: Build single-file app
        run: npm run build
      - name: Install browser test tools (CI only, not app dependencies)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0 axe-core@4
          npx playwright install --with-deps chromium
      - name: Real-browser smoke test
        run: TZ=Asia/Qatar NODE_PATH="$RUNNER_TEMP/tools/node_modules" npm run smoke
